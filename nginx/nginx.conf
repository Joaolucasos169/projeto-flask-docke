events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # Nginx escuta na porta 80 (a porta 80 do Nginx será mapeada para 8000 na máquina local)
        listen 80;
        server_name localhost;

        location / {
            # 1. ENCAMINHA A REQUISIÇÃO PARA O SEU SERVIÇO 'web'
            proxy_pass http://web:5000;
            
            # 2. ADICIONA O CABEÇALHO X-Forwarded-For COM O IP REAL DO CLIENTE
            # Esta linha garante que o Flask veja o IP original (e não o IP interno do Docker)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}