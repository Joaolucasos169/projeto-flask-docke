<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Sistemas Operacionais Registrados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <p><a href="/">← Voltar ao Explorador de Arquivos</a></p>
    <h1>Sistemas Operacionais Registrados</h1>

    {% if sistemas %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Sistema Operacional</th>
                <th>Versão</th>
            </tr>
        </thead>
        <tbody>
            {% for so in sistemas %}
            <tr>
                <td>{{ so.id }}</td>
                <td>{{ so.nome_so }}</td>
                <td>{{ so.versao_so }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>Nenhum sistema operacional registrado ainda.</p>
    {% endif %}

</body>
</html>
